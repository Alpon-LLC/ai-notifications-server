name: Semgrep CE
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install Semgrep CE
        run: python -m pip install 'setuptools<81' 'semgrep==1.136.0'
      - name: Scan
        run: semgrep scan --config p/default --config .semgrep.yml --sarif --output semgrep.sarif
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif
      - name: Findings summary
        if: always() && hashFiles('semgrep.sarif') != ''
        run: python3 scripts/semgrep_pr_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Post findings to PR
        if: always() && hashFiles('semgrep.sarif') != '' && github.event_name == 'pull_request'
        run: |
          SUMMARY=$(python3 scripts/semgrep_pr_summary.py)
          # Upsert: update the bot's existing findings comment if present, else create.
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq "[.[] | select(.user.login == 'github-actions[bot]' and (.body | contains('Semgrep findings')))][0].id" || echo "")
          if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$SUMMARY"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
