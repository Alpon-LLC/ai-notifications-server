name: Semgrep CE
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install Semgrep CE
        run: python -m pip install 'semgrep==1.136.0'
      - name: Scan
        run: semgrep scan --config p/default --config .semgrep.yml --sarif --output semgrep.sarif
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@04daf014b50eaf106734f5eaf6c2468c8a4af2f6 # v3.30.5
        with:
          sarif_file: semgrep.sarif
